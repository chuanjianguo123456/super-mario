<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>超级马里奥</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #0b0b12; overflow: hidden;
    font-family: monospace;
  }
  #wrap {
    width: 100%; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; box-sizing: border-box; padding: 10px;
  }
  canvas {
    display: block; width: min(100%, 768px); height: auto;
    max-height: calc(100vh - 116px);
    aspect-ratio: 16 / 15;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 2px #000, 0 8px 40px rgba(0,0,0,.8);
    touch-action: none;
  }
  .touch-controls {
    display: flex; align-items: center; justify-content: space-between;
    width: min(100%, 768px); gap: 12px; user-select: none;
  }
  .touch-group { display: flex; gap: 8px; }
  .touch-button {
    width: 54px; height: 42px; border: 1px solid #4b5268; border-radius: 6px;
    background: #202536; color: #f8f5e8; font: bold 18px monospace;
    box-shadow: inset 0 -3px 0 #111522; touch-action: none;
  }
  .touch-button:active, .touch-button.is-held { background: #d84a35; transform: translateY(2px); box-shadow: none; }
  .touch-button.utility { width: 46px; font-size: 14px; }
  @media (min-width: 700px) and (min-height: 760px) { .touch-controls { display: none; } }
  @media (max-width: 420px) {
    #wrap { justify-content: flex-start; padding: 7px; gap: 7px; }
    canvas { max-height: calc(100vh - 76px); }
    .touch-controls, .touch-group { gap: 6px; }
    .touch-button { width: 42px; height: 38px; }
    .touch-button.utility { width: 38px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="768" height="720"></canvas>
  <nav class="touch-controls" aria-label="触控操作">
    <div class="touch-group">
      <button class="touch-button" data-key="KeyA" aria-label="向左">◀</button>
      <button class="touch-button utility" data-key="KeyS" aria-label="下水管">▼</button>
      <button class="touch-button" data-key="KeyD" aria-label="向右">▶</button>
    </div>
    <div class="touch-group">
      <button class="touch-button utility" data-key="KeyP" aria-label="暂停">Ⅱ</button>
      <button class="touch-button" data-key="Space" aria-label="跳跃">跳</button>
      <button class="touch-button utility" data-key="KeyX" aria-label="奔跑或发射">跑</button>
    </div>
  </nav>
</div>

<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/tiles.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script src="app.js"></script>
<script>
  if (window.Input && Input.bindTouch) {
    Input.bindTouch(document.querySelectorAll('.touch-button'));
  }
</script>
</body>
</html>
